name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      matrix:
        # macOS: bash 3.2, the default shell of the developers' machines
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck bin/deploy tests/deploy-test.sh
      - name: Test bin/deploy
        run: tests/deploy-test.sh
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Check code style, static analysis and tests
        run: composer check
